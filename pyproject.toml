[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wtenv"
description = "Give each git worktree its own ports, env file, database, and docker-compose project."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "typer>=0.27,<1",
    "pydantic>=2.13,<3",
    "psycopg[binary]>=3.3,<4",
    "filelock>=4.0,<5",
    "platformdirs>=4.12,<5",
]

[project.scripts]
wtenv = "wtenv.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "testcontainers",
]

[tool.hatch.version]
path = "src/wtenv/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/wtenv", "pyproject.toml", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: needs real git worktrees or Docker",
]

[tool.coverage.run]
source = ["wtenv"]
# Measure wtenv processes that tests start. The "subprocess" patch turns on `parallel`.
patch = ["subprocess", "execv"]
